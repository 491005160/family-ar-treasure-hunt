name: Deploy GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: npm run build
      - name: Prepare GitHub Pages assets
        run: npm run prepare:pages
      - name: Test exported site
        run: npm test && npm run test:static
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before retrying Pages
        if: steps.deployment_1.outcome == 'failure'
        run: sleep 30
      - name: Retry GitHub Pages deployment
        if: steps.deployment_1.outcome == 'failure'
        id: deployment_2
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before final Pages retry
        if: steps.deployment_2.outcome == 'failure'
        run: sleep 60
      - name: Final GitHub Pages deployment attempt
        if: steps.deployment_2.outcome == 'failure'
        id: deployment_3
        uses: actions/deploy-pages@v5
